name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect and Deploy
        uses: appleboy/ssh-action@v1.0.0

        with:
          host: 13.49.145.183
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/devops-project
            git pull origin main
            sudo rm -rf /var/www/html/*
            sudo cp -r ~/devops-project/* /var/www/html/
